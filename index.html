<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日本語Substack × Kindle著者一覧</title>
  <meta name="description" content="日本語でSubstackを発信し、Amazon Kindleでも著書を確認できた人の一覧。現在は公開準備中です。">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #d97706;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
    }
    main {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 64px 0;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(0,0,0,.04);
    }
    .eyebrow {
      color: var(--accent);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin: 0 0 8px;
    }
    h1 {
      font-size: clamp(1.7rem, 5vw, 2.5rem);
      line-height: 1.35;
      margin: 0 0 20px;
    }
    p { margin: 0 0 16px; }
    .muted { color: var(--muted); }
    .status {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #fff7ed;
      color: #9a3412;
      font-size: .9rem;
      font-weight: 700;
    }
    footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: .85rem;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --card: #1f2937;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --line: #374151;
      }
      .status {
        background: #3f2a14;
        color: #fdba74;
      }
    }
    @media (max-width: 560px) {
      main { padding: 28px 0; }
      .card { padding: 24px 20px; border-radius: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="page-title">
      <p class="eyebrow">Substack × Kindle</p>
      <h1 id="page-title">日本語Substack × Kindle著者一覧</h1>
      <p>日本語でSubstackを発信し、Amazon Kindleでも著書を確認できた人をまとめる公開ページです。</p>
      <p class="muted">現在は公開準備中です。調査済みデータの再検証と、検索・絞り込みに対応した一覧ページへ更新予定です。</p>
      <span class="status">公開準備中</span>
    </section>
    <footer>nekomagu1002-lab / substack-kindle-authors</footer>
  </main>
</body>
</html>
