name: Build PDF snapshot

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/make-print-html.py'
      - 'scripts/render-pdf.mjs'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare print HTML
        run: python3 scripts/make-print-html.py

      - name: Render PDF
        run: node scripts/render-pdf.mjs

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: substack-kindle-authors-pdf
          path: substack-kindle-authors.pdf
          if-no-files-found: error

      - name: Commit PDF snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add substack-kindle-authors.pdf
          git diff --cached --quiet || git commit -m 'Update PDF snapshot'
          git push
